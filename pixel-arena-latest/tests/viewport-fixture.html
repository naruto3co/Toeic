<!doctype html><html><head><meta charset="utf-8"><title>Viewport QA</title><style>body{margin:0;background:#31354b;color:white;font:12px system-ui}header{display:flex;align-items:center;gap:6px;height:35px;padding:6px;box-sizing:border-box}button{cursor:pointer}#pane{position:relative;margin:6px auto;overflow:hidden}iframe{border:0;transform-origin:top left}output{font-size:11px}</style></head><body><header><button data-size="360,640">Phone 360×640</button><button data-size="390,844">Phone 390×844</button><button data-size="844,390">Landscape 844×390</button><button data-size="1024,600">Laptop 1024×600</button><output id="report"></output></header><div id="pane"><iframe title="Responsive game test" src="/#games/boss" allow="fullscreen"></iframe></div><script>
const frame=document.querySelector('iframe'),pane=document.querySelector('#pane');let size=[360,640];function resize(){const[w,h]=size,scale=Math.min(1,(innerWidth-16)/w,(innerHeight-47)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';pane.style.width=w*scale+'px';pane.style.height=h*scale+'px';}document.addEventListener('click',e=>{if(e.target.dataset.size){size=e.target.dataset.size.split(',').map(Number);resize();}});resize();addEventListener('resize',resize);setInterval(()=>{const d=frame.contentDocument,w=frame.contentWindow;if(!d?.body)return;const errors=[];for(const e of d.querySelectorAll('.hero-choice,.spell-card,.t-answers button,.relics button,.shop-card,[data-battle="begin"],[data-battle="next"],[data-screen-toggle],.launch-row .t-button')){const r=e.getBoundingClientRect();if(!r.width||!r.height)continue;if(r.top<-.5||r.left<-.5||r.right>w.innerWidth+.5||r.bottom>w.innerHeight+.5)errors.push(e.textContent.trim()+' outside screen');const panel=e.closest('.t-panel,.t-quiz,.hero-choices');if(panel){const p=panel.getBoundingClientRect();if(r.bottom>p.bottom+1||r.right>p.right+1)errors.push(e.textContent.trim()+' clipped by panel');}}document.querySelector('#report').textContent=size.join('×')+': '+(errors.length?errors.join(' | '):'all choices fit');},300);
</script></body></html>
